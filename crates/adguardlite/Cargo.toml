[package]
name = "adguardlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "AdGuardHome"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
agl-config = { version = "0.107.79", path = "../agl-config" }
agl-core = { version = "0.107.79", path = "../agl-core" }
agl-dns = { version = "0.107.79", path = "../agl-dns" }
agl-filter = { version = "0.107.79", path = "../agl-filter" }
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
hickory-proto = "0.26.3"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "tokio"] }
jiff = { version = "0.2.37", features = ["serde"] }
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.15.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "fs"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
webpki-roots = "1.0.9"
