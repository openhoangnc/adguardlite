[package]
name = "agl-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
agl-bolt = { version = "0.107.79", path = "../agl-bolt" }
agl-config = { version = "0.107.79", path = "../agl-config" }
agl-core = { version = "0.107.79", path = "../agl-core" }
agl-dns = { version = "0.107.79", path = "../agl-dns" }
agl-filter = { version = "0.107.79", path = "../agl-filter" }
agl-querylog = { version = "0.107.79", path = "../agl-querylog" }
agl-stats = { version = "0.107.79", path = "../agl-stats" }
ahash = "0.8.12"
axum = { version = "0.8.9", features = ["http1", "http2", "json", "query", "tokio"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
flate2 = "1.1.10"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hickory-proto = "0.26.3"
bytes = "1.12.1"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = "1.11.1"
hyper-util = { version = "0.1.20", features = ["server", "server-auto", "tokio"] }
jiff = { version = "0.2.37", features = ["serde"] }
mime_guess = "2.0.5"
parking_lot = "0.12.5"
rand = "0.10.2"
rust-embed = "8.12.0"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "fs"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip", "set-header"] }
tracing = "0.1.44"

[dev-dependencies]
agl-config = { path = "../agl-config" }
rcgen = "0.14.10"
rustls-pemfile = "2.2.0"
agl-dns = { path = "../agl-dns" }
agl-filter = { path = "../agl-filter" }
agl-querylog = { path = "../agl-querylog" }
agl-stats = { path = "../agl-stats" }
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
http-body-util = "0.1.5"
jiff = "0.2.37"
parking_lot = "0.12.5"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
