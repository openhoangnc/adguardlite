[package]
name = "agl-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["http1", "http2", "json", "query", "tokio"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
http = "1.5.0"
hyper = "1.11.1"
mime_guess = "2.0.5"
rand = "0.10.2"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "fs"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip", "set-header"] }
