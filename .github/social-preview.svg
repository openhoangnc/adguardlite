<!--
  The repository's social preview, 1280x640: uploaded under Settings -> Social
  preview, and shown at the top of README.md.

  This file is the source and .github/social-preview.png is what GitHub serves,
  so re-render it after any change here.  The funnel is the mark from
  web/client/public/assets/favicon.svg, and the colours are the web interface's
  dark theme, from web/client/src/styles/app.css.  The text is set in Helvetica
  Neue: a renderer without that family substitutes another face, which moves
  the pill boxes off their labels.  The committed PNG came from @resvg/resvg-js.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#171d24"/>
      <stop offset="1" stop-color="#0f1317"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4a017" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d4a017" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5b423"/>
      <stop offset="1" stop-color="#b8860d"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <ellipse cx="986" cy="290" rx="400" ry="340" fill="url(#glow)"/>
  <rect width="1280" height="1" fill="#ffffff" opacity="0.06"/>

