name: Release

# Builds the binaries the installer downloads and attaches them to the
# release for the tag.
#
# The archives are what `scripts/install.sh` fetches, so their names and the
# layout inside them are a contract: `sift_<os>_<cpu>.tar.gz`, holding
# `AdGuardHome/AdGuardHome` — AdGuard Home's own package layout, which is what
# lets an existing installation be upgraded in place.  `scripts/package.sh`
# builds them, here and by hand alike.
#
# Every Linux build is statically linked against musl, so one archive per
# architecture runs on any distribution, however old its glibc.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and attach the archives to.
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # A tag is the one moment the suite is worth paying for on a clean machine:
  # ci.yml is deliberately manual, and a release nobody can un-publish should
  # not be the first place a red test is noticed.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace --locked

  build:
    name: ${{ matrix.os }}_${{ matrix.cpu }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      # A leg that fails should not take the others down with it: the failure
      # is easier to read next to four archives that did build.
      fail-fast: false
      matrix:
        include:
          - os: linux
            cpu: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - os: linux
            cpu: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          # The only leg that is not built on its own architecture.  There is
          # no 32-bit Arm runner, and no musl cross toolchain in apt, so this
          # one goes through cross's container images.
          - os: linux
            cpu: armv7
            target: armv7-unknown-linux-musleabihf
            runner: ubuntu-latest
            cross: true
          - os: darwin
            cpu: amd64
            target: x86_64-apple-darwin
            runner: macos-latest
          - os: darwin
            cpu: arm64
            target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Toolchain
        run: |
          # Naming no toolchain installs the one rust-toolchain.toml pins,
          # rather than whatever the runner happens to ship.
          rustup show
          rustup target add '${{ matrix.target }}'

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ring, the rustls crypto provider, needs a C compiler for the target.
      # cc-rs looks for musl-gcc on a musl target, which is what this package
      # provides for the architecture it is installed on.
      - name: musl toolchain
        if: matrix.os == 'linux' && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: cross
        if: matrix.cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build
        run: |
          set -eu
          if [ '${{ matrix.cross }}' = 'true' ]; then
            cross build --locked --profile dist --bin AdGuardHome --target '${{ matrix.target }}'
          else
            cargo build --locked --profile dist --bin AdGuardHome --target '${{ matrix.target }}'
          fi

      - name: Package
        run: |
          scripts/package.sh \
            'target/${{ matrix.target }}/dist/AdGuardHome' \
            '${{ matrix.os }}' \
            '${{ matrix.cpu }}' \
            dist

      # A binary for the machine this runs on is worth starting once: a
      # missing symbol or a bad crypto provider fails here rather than on
      # somebody's DNS server.
      - name: It runs
        if: |
          (matrix.cpu == 'amd64' && matrix.os == 'linux' && runner.arch == 'X64')
          || (matrix.cpu == 'arm64' && matrix.os == 'linux' && runner.arch == 'ARM64')
          || (matrix.cpu == 'arm64' && matrix.os == 'darwin')
        run: |
          set -eu
          'target/${{ matrix.target }}/dist/AdGuardHome' --version
          'target/${{ matrix.target }}/dist/AdGuardHome' --version | grep -q '^Sift, version v'

      - uses: actions/upload-artifact@v4
        with:
          name: sift_${{ matrix.os }}_${{ matrix.cpu }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Attach to the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: sift_*
          merge-multiple: true

      - name: Checksums and version
        id: meta
        run: |
          set -eu
          tag='${{ github.event.inputs.tag || github.ref_name }}'
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          cd dist
          ls -l
          sha256sum sift_*.tar.gz > checksums.txt
          cat checksums.txt

          # The installer reads this to learn what the newest release is: one
          # unauthenticated GET of a fixed URL, rather than the API, which
          # rate-limits by address and would refuse a whole household behind
          # one of them.
          printf '%s\n' "$tag" > version.txt

      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -eu
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes --title "Sift $TAG"
          fi

          gh release upload "$TAG" --clobber \
            dist/sift_*.tar.gz dist/checksums.txt dist/version.txt

          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name)\t\(.size)"'
